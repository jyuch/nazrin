[package]
name = "nazrin"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
walkdir = { version = "2.5" }
base64 = { version = "0.22" }
anyhow = { version = "1" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation"
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
